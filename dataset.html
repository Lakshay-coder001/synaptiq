<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Synaptiq">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/history.css">
    <title>Synaptiq</title>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo"><span class="logo-icon"></span>
                    Synaptiq
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <span class="toggle-icon"><i class="fa-solid fa-bars"></i></span>
                </button>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item ">
                    <a href="index.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-table-cells"></i></span>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="experiment.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-flask"></i></span>Experiment</a>
                </li>
                <li class="nav-item">
                    <a href="training.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-gears"></i></span>Training</a>
                </li>
                <li class="nav-item">
                    <a href="history.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-clock-rotate-left"></i></span>History</a>
                </li>
                <li class="nav-item nav-item--active">
                    <a href="dataset.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-folder"></i></span>Dataset</a>
                </li>
                <li class="nav-item"><a href="comparision.html" class="nav-link"><span class="nav-icon">
                    <i class="fa-solid fa-square-poll-horizontal"></i></span>Compare</a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <span class="sidebar-version">v1.0.0</span>
            </div>
        </nav>

        <main class="main-content">
            <header class="page-header">
                <div class="page-header-left">
                    <button class="sidebar-toggle-mobile" id="mobileSidebarToggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                    <h2 class="page-title">Datasets</h2>
                </div>
                <div class="page-actions">
                </div>
            </header>
            <div class="page-body">
                <div class="csv-import-area card" id="csvImportArea" style="cursor: pointer; text-align: center; padding: 3rem 1rem; border: 2px dashed var(--border-color); margin-bottom: 2rem;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;"><i class="fa-solid fa-file-import"></i></div>
                    <h3 style="margin-bottom: 0.5rem;">Drop a CSV file here or click to upload</h3>
                    <p style="color: var(--text-secondary);">Supported: CSV files with numeric data. Last column is treated as the target.</p>
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                </div>

                <div id="datasetsContainer" class="datasets-grid grid-3">
                    <!-- will fill with js dynamically -->
                </div>
            </div>
        </main>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="modalContainer"></div>
</body>
</html>
