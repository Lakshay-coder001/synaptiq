<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Synaptiq">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/comparision.css">
    <title>Synaptiq</title>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo"><span class="logo-icon"></span>
                    <a class= "sidebar-logo" href="index.html">Synaptiq</a>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <span class="toggle-icon"><i class="fa-solid fa-bars"></i></span>
                </button>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item ">
                    <a href="index.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-table-cells"></i></span>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="experiment.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-flask"></i></span>Experiment</a>
                </li>
                <li class="nav-item">
                    <a href="training.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-gears"></i></span>Training</a>
                </li>
                <li class="nav-item">
                    <a href="history.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-clock-rotate-left"></i></span>History</a>
                </li>
                <li class="nav-item">
                    <a href="dataset.html" class="nav-link"><span class="nav-icon"><i class="fa-solid fa-folder"></i></span>Dataset</a>
                </li>
                <li class="nav-item nav-item--active"><a href="comparison.html" class="nav-link"><span class="nav-icon">
                    <i class="fa-solid fa-square-poll-horizontal"></i></span>Compare</a>
                </li>
            </ul>
            <div class="sidebar-footer">
                <span class="sidebar-version">v1.0.0</span>
            </div>
        </nav>

        <main class="main-content">
            <header class="page-header">
                <div class="page-header-left">
                    <button class="sidebar-toggle-mobile" id="mobileSidebarToggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
                    <h2 class="page-title">Compare Runs</h2>
                </div>
                <div class="page-actions">
                    <button id="btnCompare" class="btn btn-primary" disabled>Compare</button>
                </div>
            </header>
            <div class="page-body">
                <div class="card comparison-selector">
                    <div class="card-header">
                        <h3 class="card-title">Select Training Runs to Compare</h3>
                    </div>
                    <div class="card-body">
                        <div id="runSelector" class="table-container">
                        <!-- js will render this //need to complete this -->
                        </div>
                    </div>
                </div>

                <div id="comparisonResults" class="hidden">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Metrics Comparison</h3>
                        </div>
                        <div class="card-body table-container">
                            <table id="comparisonTable" class="data-table comparison-table">
                                <!-- same here -->
                            </table>
                        </div>
                    </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Charts Comparison</h3>
                    </div>
                    <div class="card-body comparison-charts" id="comparisonCharts">
                        <div style="flex: 1; min-width: 300px;">
                            <h4 style="margin-bottom: 1rem; font-size: 0.875rem; font-weight: 500;">Loss Comparison</h4>
                            <div class="chart-canvas-wrapper">
                                <canvas id="lossCompareChart"></canvas>
                            </div>
                        </div>
                        <div style="flex: 1; min-width: 300px;">
                            <h4 style="margin-bottom: 1rem; font-size: 0.875rem; font-weight: 500;">Accuracy Comparison</h4>
                            <div class="chart-canvas-wrapper">
                                <canvas id="accCompareChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </main>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <div id="modalContainer"></div>
    <script src="js/utils.js"></script>
    <script src="js/custom-promise.js"></script>
    <script src="js/state.js"></script>
    <script src="js/db.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cache.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
    <script src="js/comparison.js"></script>
</body>
</html>
